name: Update Now Playing

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-playing
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Recognize current song
        env:
          ACR_HOST: ${{ secrets.ACR_HOST }}
          ACR_ACCESS_KEY: ${{ secrets.ACR_ACCESS_KEY }}
          ACR_ACCESS_SECRET: ${{ secrets.ACR_ACCESS_SECRET }}
        run: python recognize.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add now_playing.json
          git diff --staged --quiet || git commit -m "Update now playing"
          git push
